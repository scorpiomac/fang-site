# Site FANG — référence nginx (copier vers /etc/nginx/sites-available/fang.tickets-place.net.conf)
# Activer : ln -sf /etc/nginx/sites-available/fang.tickets-place.net.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name fang.tickets-place.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fang.tickets-place.net;

    ssl_certificate     /etc/letsencrypt/live/fang.tickets-place.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fang.tickets-place.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/local/etc/fang-site/dist;
    index index.html;

    client_max_body_size 50m;
    proxy_read_timeout 120s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml+rss
        image/svg+xml;

    access_log /var/log/nginx/fang.tickets-place.net.access.log;
    error_log  /var/log/nginx/fang.tickets-place.net.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:5170;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # ^~ obligatoire : sinon la regex *.mp4/*.jpg en dessous intercepte cms-media
    location ^~ /cms-media/ {
        alias /usr/local/etc/fang-site/cms-media/;
        expires 7d;
        add_header Cache-Control "public";
        types {
            video/mp4 mp4;
            video/webm webm;
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
        }
        default_type application/octet-stream;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5170;
        proxy_set_header Host $host;
        expires 7d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(jpg|jpeg|png|gif|webp|ico|svg|woff|woff2|ttf|eot|mp3|mp4|webm)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
